name: Generate API Docs

# ---------------------------------------------------------------------------
# Generic workflow — drop this file into any repo that ships a
# public_headers/config.yml.  It reads every path listed under a "headers:"
# key in that YAML, generates a Doxygen HTML reference, uploads the result
# as a build artifact, and deploys it to the gh-pages branch.
# Triggers: push to main (when headers or this workflow change), workflow_dispatch.
# ---------------------------------------------------------------------------

on:
  push:
    branches: ["master"]
    paths:
      - "**.h"
      - "**.hpp"
  workflow_dispatch:   # allow manual runs

permissions:
  contents: write      # needed to push to gh-pages

jobs:
  build-api-docs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install tools ───────────────────────────────────────────────────
      - name: Install Doxygen and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen python3-yaml

      # ── 3. Extract public headers from config.yml ─────────────────────────
      #  Walks every node in the YAML and collects all values that appear
      #  under a key named "headers", regardless of nesting depth.
      #  Result is written to /tmp/public_headers.txt, one path per line.
      - name: Parse public_headers/config.yml
        id: parse_headers
        run: |
          python3 - <<'EOF'
          import yaml, sys, os, glob

          config_path = "public_headers/config.yml"
          if not os.path.exists(config_path):
              print(f"ERROR: {config_path} not found", file=sys.stderr)
              sys.exit(1)

          with open(config_path) as f:
              config = yaml.safe_load(f)

          patterns = set()

          def collect(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == "headers" and isinstance(v, list):
                          patterns.update(str(h) for h in v)
                      else:
                          collect(v)
              elif isinstance(obj, list):
                  for item in obj:
                      collect(item)

          collect(config)

          if not patterns:
              print("ERROR: no 'headers' entries found in config.yml", file=sys.stderr)
              sys.exit(1)

          # Expand globs to actual files (also works for direct paths)
          headers = set()
          for pattern in patterns:
              matched = glob.glob(pattern, recursive=True)
              if matched:
                  headers.update(matched)
              else:
                  print(f"WARNING: no files matched pattern: {pattern}", file=sys.stderr)

          if not headers:
              print("ERROR: no header files found after glob expansion", file=sys.stderr)
              sys.exit(1)

          # Write one path per line; also print for log visibility
          with open("/tmp/public_headers.txt", "w") as out:
              for h in sorted(headers):
                  print(h)          # visible in Actions log
                  out.write(h + "\n")
          EOF

      # ── 4. Generate Doxyfile dynamically ───────────────────────────────────
      - name: Create Doxyfile
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Build the space-separated INPUT list from the parsed headers
          INPUT_LIST=$(tr '\n' ' ' < /tmp/public_headers.txt)

          cat > /tmp/Doxyfile <<DOXYEOF
          # Auto-generated by api-docs.yml — do not edit by hand
          PROJECT_NAME           = "${REPO_NAME}"
          PROJECT_BRIEF          = "Public API Reference"
          OUTPUT_DIRECTORY       = api-docs
          CREATE_SUBDIRS         = NO

          # --- Input ---
          INPUT                  = ${INPUT_LIST}
          RECURSIVE              = NO
          FILE_PATTERNS          = *.h *.hpp

          # --- Extraction ---
          EXTRACT_ALL            = YES
          EXTRACT_PRIVATE        = NO
          EXTRACT_STATIC         = YES
          HIDE_UNDOC_MEMBERS     = NO
          HIDE_UNDOC_CLASSES     = NO

          # --- Output formats ---
          GENERATE_HTML          = YES
          HTML_OUTPUT            = html
          GENERATE_TREEVIEW      = YES
          GENERATE_LATEX         = NO

          # --- Source browsing ---
          SOURCE_BROWSER         = NO
          INLINE_SOURCES         = NO
          VERBATIM_HEADERS       = NO
          REFERENCES_LINK_SOURCE = NO
          SHOW_USED_FILES        = NO

          # --- Navigation ---
          ALPHABETICAL_INDEX     = NO
          CLASS_DIAGRAMS         = NO

          # --- Misc ---
          OPTIMIZE_OUTPUT_FOR_C  = YES
          BUILTIN_STL_SUPPORT    = YES
          MARKDOWN_SUPPORT       = YES
          AUTOLINK_SUPPORT       = YES
          SORT_MEMBER_DOCS       = YES
          SHOW_INCLUDE_FILES     = YES
          GENERATE_TODOLIST      = YES
          WARN_IF_UNDOCUMENTED   = YES
          QUIET                  = NO
          SEARCHENGINE           = NO
          DOXYEOF

          echo "--- Doxyfile contents ---"
          cat /tmp/Doxyfile

      # ── 5. Run Doxygen ─────────────────────────────────────────────────────
      - name: Run Doxygen
        run: doxygen /tmp/Doxyfile

      # ── 6. Upload HTML as a build artifact ────────────────────────────────
      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-html
          path: api-docs/html/
          if-no-files-found: error

      # ── 7. Deploy to gh-pages ─────────────────────────────────────────────
      - name: Deploy to gh-pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: api-docs/html
          publish_branch: gh-pages
          commit_message: "docs: update API reference [${{ github.sha }}]"


